services:
  - type: web
    name: magnata-holerite-splitter
    runtime: python
    buildCommand: pip install -r requirements.txt
    # DIVERGÊNCIA CONFIRMADA em 2026-10-03 via API do Render
    # (`GET /v1/services/srv-d8iqj3uk1jcs73ap1np0`): o serviço real foi
    # criado à mão (sem Blueprint) e seu Start Command no painel é
    # `--workers 1 --max-requests 50` (sem `--max-requests-jitter`) --
    # exatamente o risco que o comentário anterior deste arquivo já
    # alertava ("serviço criado à mão usa o Procfile ou o Start Command
    # do painel", não este arquivo). `render.yaml` e `Procfile` nunca
    # foram aplicados a este serviço. Este valor abaixo foi corrigido
    # para refletir a configuração REAL em produção -- não é uma
    # recomendação de capacidade, é a verdade observada. Não sei se
    # `--workers 1` foi uma escolha deliberada (ex.: limite de RAM do
    # plano `starter`) ou um valor residual de outra fase -- decisão de
    # capacidade de produção é gate humano (CLAUDE.md §12-I), não
    # alterada aqui. Se um Blueprint for rodado a partir deste arquivo no
    # futuro, ele VAI mudar o serviço real para este valor -- confirmar
    # a decisão de capacidade antes disso.
    startCommand: gunicorn app:app --workers 1 --timeout 300 --max-requests 50 --bind 0.0.0.0:$PORT --log-level info
    # healthCheckPath DECLARADO aqui mas SEM EFEITO sobre o serviço real
    # ainda (nenhum Blueprint foi aplicado -- ver nota em `databases`
    # abaixo). Confirmado em 2026-10-03 via API que o serviço real está
    # com `healthCheckPath` vazio (Render não monitora `/health` para
    # decidir saúde/substituição de instância). Nota já registrada em
    # memória do projeto: `/health` hoje sempre responde 200 mesmo com
    # Airtable fora do ar -- aplicar este health check ao serviço real
    # antes de corrigir esse comportamento daria falso positivo de
    # saúde, não falso negativo, então declarar o caminho aqui é seguro,
    # mas ativá-lo de fato no painel é uma decisão separada.
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: magnata-os-postgres
          property: connectionString

  - type: worker
    name: magnata-holerite-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A celery_app.celery_app worker --loglevel=INFO --concurrency=2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: magnata-os-postgres
          property: connectionString

  # DESCOBERTO em 2026-10-03 (Frente E -- infra e operação 24x7), NUNCA
  # declarado em `render.yaml` antes: o worker Celery usa um Redis real
  # já provisionado em produção como broker/result backend
  # (`redis://red-d9f2ttrbc2fs7390k2q0:...`, visto nos logs de boot do
  # worker e confirmado via API -- nome `magnata-pdf-queue`,
  # `plan: free`, `persistenceMode: off`). `REDIS_URL`/`CELERY_BROKER_URL`
  # são lidas de variável de ambiente em `celery_app.py`, nunca
  # hardcoded -- mas o recurso em si nunca apareceu em nenhum mapa do
  # projeto nem neste arquivo, então nenhum Blueprint o enxergava. Bloco
  # abaixo é só DOCUMENTAÇÃO da infra real (nenhum Blueprint foi
  # aplicado a partir deste arquivo -- ver nota em `databases`); não
  # provisiona nada novo. Riscos reais que isso deixou invisível até
  # agora, sinalizados para decisão humana, não corrigidos aqui:
  # (1) plano `free` do Redis no Render tem janela de expiração e pode
  # ser recriado/apagado automaticamente por inatividade -- se isso
  # ocorrer, o worker perde o broker sem aviso prévio no código; (2)
  # `persistenceMode: off` -- qualquer tarefa Celery enfileirada e ainda
  # não processada é perdida se o Redis reiniciar (aceitável só se o
  # fluxo de PDF for idempotente e reenfileirável por fora, o que não
  # foi verificado nesta investigação).
  - type: redis
    name: magnata-pdf-queue
    plan: free
    ipAllowList: []

  # Serviço DECLARATIVO, NÃO provisionado nesta fase -- nenhum Blueprint
  # foi rodado com este bloco. Cron Job dedicado (nunca Celery Beat: o
  # worker acima continua só PDF, sem `-B`, para não virar um scheduler
  # improvisado nem correr risco de singleton/escala do beat) para
  # repetir `ciclo_producao_v1.executar_um_ciclo_producao` -- um disparo
  # síncrono que sempre termina; quem evita overlap entre disparos é o
  # advisory lock de sessão dentro do próprio ciclo (defesa primária),
  # com CAS por ação como defesa final. Ativar isto exige, na ordem: (1)
  # rodar este Blueprint (gate humano de produção); (2) configurar
  # ORQUESTRADOR_S3_BUCKET/PREFIXO, ORQUESTRADOR_ASSINATURA_BASE_URL/
  # API_KEY reais (gate humano, escrita externa não abrangida por esta
  # fase); (3), só then/depois e como decisão separada, considerar
  # ORQUESTRADOR_TRANSPORTE_REAL_AUTORIZADO -- nunca antes das duas
  # barreiras anteriores e nunca por este arquivo (é variável de
  # ambiente, não de Blueprint versionado). Schedule de exemplo: a cada
  # 5 minutos -- ajustar de acordo com o volume real observado.
  - type: cron
    name: magnata-orquestrador-ciclo-producao
    runtime: python
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m magnata_os.orquestrador.ciclo_producao_v1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: magnata-os-postgres
          property: connectionString
      # ORQUESTRADOR_S3_BUCKET, ORQUESTRADOR_S3_PREFIXO,
      # ORQUESTRADOR_ASSINATURA_BASE_URL, ORQUESTRADOR_ASSINATURA_API_KEY
      # e credenciais AWS/S3 (via variável de ambiente padrão do
      # boto3, nunca hardcoded aqui) são deliberadamente OMITIDOS deste
      # Blueprint -- configuração real de produção é gate humano
      # separado, fora do escopo desta fase. Sem eles, o ciclo falha
      # alto e explícito (RuntimeError), nunca silenciosamente.

# databases: bloco DECLARATIVO, preparado para o gate humano de
# provisionamento real -- NAO executado/aplicado nesta fase (nenhum
# Blueprint foi rodado: confirmado via API do Render em 2026-10-03,
# `GET /v1/blueprints` retorna lista vazia para esta conta). `plan: free`
# e um placeholder seguro (nao implica compra nem decisao de custo) -- NAO
# e uma recomendacao para producao: o tier gratuito do Postgres do Render
# expira automaticamente apos um periodo e nao e adequado para
# persistencia durevel. A escolha do plano real (starter/standard/etc.) e
# uma decisao financeira explicitamente pendente -- ver relatorio desta
# fase, item "decisoes de custo/infra pendentes". `postgresMajorVersion`
# fixado para reprodutibilidade -- confirmar contra a versao real
# disponivel no Render no momento do provisionamento (gate humano
# separado, fora desta fase).
#
# `name` corrigido em 2026-10-03 de `magnata-os-db` para
# `magnata-os-postgres`: esse e o nome real do Postgres ja provisionado
# manualmente em produção (`dpg-d9t3ig8n74is73fu2cl0-a`, plano
# basic_256mb, confirmado via API do Render) -- o nome anterior era so
# desatualizacao deste arquivo, nunca refletiu o banco real. Como nenhum
# Blueprint existe para esta conta, nao ha risco de um "sync" futuro ter
# criado ou vir a criar um banco duplicado a partir deste arquivo; o
# risco real e diferente: se alguem no futuro criar um Blueprint novo no
# painel do Render a partir deste `render.yaml`, o nome aqui precisa
# bater com o banco real para o Render linkar a ele em vez de provisionar
# um banco novo -- ponto ainda nao coberto por este arquivo (ligar um
# Blueprint novo a um recurso existente e uma decisao/acao manual no
# painel do Render, fora do escopo deste PR).
databases:
  - name: magnata-os-postgres
    plan: free
    postgresMajorVersion: 16
