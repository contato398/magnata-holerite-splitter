name: Urgent assinatura Airtable key isolation

on:
  push:
    branches:
      - fix/assinatura-credencial-airtable-isolada-v1

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[auto-patch-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/assinatura-credencial-airtable-isolada-v1
          fetch-depth: 0

      - name: Apply surgical patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          anchor = "AIRTABLE_API_KEY = os.environ.get('AIRTABLE_API_KEY', '')\n"
          if anchor not in s:
              raise SystemExit('anchor AIRTABLE_API_KEY não encontrado')
          if "AIRTABLE_ASSINATURA_API_KEY" not in s:
              insert = anchor + "AIRTABLE_ASSINATURA_API_KEY = os.environ.get('AIRTABLE_ASSINATURA_API_KEY', '')\n\n\ndef _airtable_api_key_atual():\n    \"\"\"Seleciona credencial Airtable por fronteira HTTP.\n\n    Rotas /assinatura usam a credencial dedicada quando configurada. Todos os\n    demais fluxos preservam AIRTABLE_API_KEY. Fora de contexto Flask, também\n    preserva a credencial global. Isso isola assinatura sem alterar legado.\n    \"\"\"\n    if AIRTABLE_ASSINATURA_API_KEY:\n        try:\n            if request.path.startswith('/assinatura'):\n                return AIRTABLE_ASSINATURA_API_KEY\n        except RuntimeError:\n            pass\n    return AIRTABLE_API_KEY\n"
              s = s.replace(anchor, insert, 1)

          old = "f'Bearer {AIRTABLE_API_KEY}'"
          count = s.count(old)
          if count < 1:
              raise SystemExit('nenhum header Airtable global encontrado para substituir')
          s = s.replace(old, "f'Bearer {_airtable_api_key_atual()}'")
          s = s.replace('if not AIRTABLE_API_KEY:', 'if not _airtable_api_key_atual():')
          p.write_text(s, encoding='utf-8')

          test = Path('test_assinatura_credencial_airtable_isolada.py')
          test.write_text('''import app as modulo\n\n\ndef _set_keys(global_key, assinatura_key):\n    modulo.AIRTABLE_API_KEY = global_key\n    modulo.AIRTABLE_ASSINATURA_API_KEY = assinatura_key\n\n\ndef test_assinatura_prefere_credencial_dedicada():\n    _set_keys("global-test", "assinatura-test")\n    with modulo.app.test_request_context("/assinatura/gerar", method="POST"):\n        assert modulo._airtable_api_key_atual() == "assinatura-test"\n\n\ndef test_pagina_publica_assinatura_usa_credencial_dedicada():\n    _set_keys("global-test", "assinatura-test")\n    with modulo.app.test_request_context("/assinatura/token-exemplo"):\n        assert modulo._airtable_api_key_atual() == "assinatura-test"\n\n\ndef test_fluxo_nao_assinatura_preserva_global():\n    _set_keys("global-test", "assinatura-test")\n    with modulo.app.test_request_context("/whatsapp/enviar-texto", method="POST"):\n        assert modulo._airtable_api_key_atual() == "global-test"\n\n\ndef test_assinatura_sem_dedicada_faz_fallback_global():\n    _set_keys("global-test", "")\n    with modulo.app.test_request_context("/assinatura/gerar", method="POST"):\n        assert modulo._airtable_api_key_atual() == "global-test"\n\n\ndef test_fora_de_request_preserva_global():\n    _set_keys("global-test", "assinatura-test")\n    assert modulo._airtable_api_key_atual() == "global-test"\n''', encoding='utf-8')

          sha = hashlib.sha256(p.read_bytes()).hexdigest()
          auth = Path('.magnata/app-py-authorizations/assinatura-credencial-airtable-isolada-v1.gitblob')
          auth.parent.mkdir(parents=True, exist_ok=True)
          auth.write_text(
              '# Autorizacao nominal: isolar credencial Airtable exclusiva das rotas /assinatura.\n'
              '# Escopo: fallback integral para AIRTABLE_API_KEY; demais rotas preservadas.\n'
              '# Autorizacao humana: usuario aprovou iniciar pela urgente e avancar ate implantacao final.\n'
              f'{sha}  app.py\n',
              encoding='utf-8',
          )
          print(f'PATCH_OK headers_substituidos={count} app_sha256={sha[:16]}')
          PY

      - name: Remove temporary workflow from final diff
        run: rm -f .github/workflows/urgent-assinatura-key-isolation.yml

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Focused validation
        env:
          MAGNATA_SESSION_SECRET_KEY: "test-session-secret-key-only-ci-1234567890"
        run: |
          python -m pytest -q test_assinatura_credencial_airtable_isolada.py test_comunicado_tipo_assinavel.py
          bash scripts/ci/validate_governance.sh

      - name: Commit final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py test_assinatura_credencial_airtable_isolada.py .magnata/app-py-authorizations/assinatura-credencial-airtable-isolada-v1.gitblob .github/workflows/urgent-assinatura-key-isolation.yml
          git commit -m "fix: isola credencial Airtable do fluxo de assinatura [auto-patch-done]"
          git push origin HEAD:fix/assinatura-credencial-airtable-isolada-v1
