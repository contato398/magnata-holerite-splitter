name: Patch protegido WhatsApp legenda

on:
  push:
    branches:
      - fix/whatsapp-video-legenda-wiring-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-video-legenda-wiring-v1
          fetch-depth: 0
      - name: Aplicar patch exato
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('app.py')
          texto = app_path.read_text(encoding='utf-8')

          antigo_helper = '''def _evolution_enviar_video(numero: str, video_base64: str, nome_arquivo: str):
              """Envia um MP4 já validado como base64 pela Evolution API."""
              endpoint = f'{EVOLUTION_API_URL}/message/sendMedia/{EVOLUTION_INSTANCE}'
              payload = {
                  'number': numero,
                  'mediatype': 'video',
                  'mimetype': 'video/mp4',
                  'media': video_base64,
                  'fileName': nome_arquivo,
              }
              resposta = requests.post(
          '''
          novo_helper = '''def _evolution_enviar_video(numero: str, video_base64: str, nome_arquivo: str, legenda: str = ''):
              """Envia um MP4 já validado como base64 pela Evolution API, com legenda opcional."""
              endpoint = f'{EVOLUTION_API_URL}/message/sendMedia/{EVOLUTION_INSTANCE}'
              payload = {
                  'number': numero,
                  'mediatype': 'video',
                  'mimetype': 'video/mp4',
                  'media': video_base64,
                  'fileName': nome_arquivo,
              }
              if legenda:
                  payload['caption'] = legenda
              resposta = requests.post(
          '''
          if texto.count(antigo_helper) != 1:
              raise SystemExit('helper de vídeo não corresponde ao baseline esperado')
          texto = texto.replace(antigo_helper, novo_helper, 1)

          antigo_campos = "campos_permitidos = {'numero', 'video_base64', 'nome_arquivo'}"
          novo_campos = "campos_permitidos = {'numero', 'video_base64', 'nome_arquivo', 'legenda'}"
          if texto.count(antigo_campos) != 1:
              raise SystemExit('campos permitidos da rota não correspondem ao baseline esperado')
          texto = texto.replace(antigo_campos, novo_campos, 1)

          antigo_validacao = '''    nome_arquivo = _sanitizar_nome_video(body.get('nome_arquivo'))
              if not nome_arquivo:
                  return jsonify({'status': 'erro', 'erro': 'Nome de arquivo inválido.'}), 400
              try:
                  _decodificar_video_mp4(body.get('video_base64'))
          '''
          nova_validacao = '''    nome_arquivo = _sanitizar_nome_video(body.get('nome_arquivo'))
              if not nome_arquivo:
                  return jsonify({'status': 'erro', 'erro': 'Nome de arquivo inválido.'}), 400
              legenda = body.get('legenda')
              if legenda is not None and not isinstance(legenda, str):
                  return jsonify({'status': 'erro', 'erro': 'Legenda inválida.'}), 400
              legenda = (legenda or '').strip()
              try:
                  _decodificar_video_mp4(body.get('video_base64'))
          '''
          if texto.count(antigo_validacao) != 1:
              raise SystemExit('bloco de validação da rota não corresponde ao baseline esperado')
          texto = texto.replace(antigo_validacao, nova_validacao, 1)

          antigo_chamada = "resultado = _evolution_enviar_video(numero, body['video_base64'], nome_arquivo)"
          nova_chamada = "resultado = _evolution_enviar_video(numero, body['video_base64'], nome_arquivo, legenda=legenda)"
          if texto.count(antigo_chamada) != 1:
              raise SystemExit('chamada do helper de vídeo não corresponde ao baseline esperado')
          texto = texto.replace(antigo_chamada, nova_chamada, 1)

          app_path.write_text(texto, encoding='utf-8')

          test_path = Path('test_whatsapp_enviar_video.py')
          testes = test_path.read_text(encoding='utf-8')
          ancora = '''    @patch('app.requests.post')
              def test_falha_simulada_da_evolution_sem_expor_resposta(self, post):
          '''
          novos_testes = '''    @patch('app.requests.post')
              def test_sucesso_com_legenda_envia_caption(self, post):
                  resposta_evolution = MagicMock(status_code=201)
                  resposta_evolution.json.return_value = {'key': {'id': 'mensagem-com-legenda'}}
                  post.return_value = resposta_evolution

                  payload = {**self.payload, 'legenda': 'Benefícios Magnata'}
                  resposta = self.client.post('/whatsapp/enviar-video', json=payload, headers=self.headers)

                  self.assertEqual(resposta.status_code, 200)
                  chamada = post.call_args
                  self.assertEqual(chamada.kwargs['json']['caption'], 'Benefícios Magnata')
                  self.assertEqual(chamada.kwargs['json']['fileName'], 'beneficios_video.mp4')

              def test_legenda_nao_string_e_rejeitada_sem_envio(self):
                  self._rejeitado_sem_envio({**self.payload, 'legenda': ['invalida']})

              @patch('app.requests.post')
              def test_falha_simulada_da_evolution_sem_expor_resposta(self, post):
          '''
          if testes.count(ancora) != 1:
              raise SystemExit('âncora dos testes não corresponde ao baseline esperado')
          testes = testes.replace(ancora, novos_testes, 1)
          test_path.write_text(testes, encoding='utf-8')
          PY
      - name: Validar escopo mínimo
        run: |
          git diff --check
          git diff -- app.py test_whatsapp_enviar_video.py
      - name: Remover workflow temporário e publicar patch
        shell: bash
        run: |
          git rm .github/workflows/_patch_whatsapp_video_legenda.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py test_whatsapp_enviar_video.py
          git commit -m "fix: aceitar legenda opcional no envio de vídeo"
          git push origin HEAD:fix/whatsapp-video-legenda-wiring-v1
