name: Magnata OS — Suíte de Testes

# Por que este workflow existe (achado da Etapa 6 da Central Command,
# 2026-08-22): até esta data o repositório tinha UM único workflow, o de
# governança, que valida branch, arquivos protegidos, segredos e
# conformidade documental — mas NÃO executa a suíte. Consequência real,
# não hipotética: 6 testes ficaram vermelhos em `main` desde 2026-08-17 e
# nenhuma automação poderia tê-los apontado. Um deles
# (test_motivo_de_bloqueio_nunca_expoe_pii) protegia contra vazamento de
# dado pessoal em log.
#
# Escopo deliberado: instalar as MESMAS dependências declaradas em
# requirements.txt e rodar pytest. Nada além disso. Sem segredo, sem
# serviço externo, sem acesso a produção, sem Airtable, sem rede de
# terceiros — a suíte é toda mockada e não faz chamada real.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          # Mesma versão declarada em render.yaml (PYTHON_VERSION 3.11.0).
          # Se divergir de produção, o teste deixa de representar produção.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # requirements.txt é a fonte única — o runner instala exatamente
          # o que produção instala. `celery` e `redis` estão lá e são
          # necessários para a coleta de 3 arquivos de teste; sem eles a
          # suíte falha por ModuleNotFoundError e a falha PARECE regressão
          # de código sem ser. Foi exatamente o que confundiu auditorias
          # anteriores.
          pip install -r requirements.txt
          # pytest não está (e não deve estar) em requirements.txt: é
          # ferramenta de teste, não dependência de execução em produção.
          pip install pytest

      - name: Conferir que as dependências de coleta existem
        # Falha cedo e com mensagem clara, em vez de deixar a suíte
        # reportar ModuleNotFoundError espalhado por vários arquivos.
        run: |
          set -euo pipefail
          python - <<'PY'
          # `import importlib` NAO carrega o submodulo util -- precisa ser
          # importado explicitamente, senao da AttributeError.
          import importlib.util
          import sys
          faltando = [m for m in ('flask', 'celery', 'redis', 'pdfplumber',
                                  'pypdf', 'fpdf', 'reportlab', 'openpyxl')
                      if not importlib.util.find_spec(m)]
          if faltando:
              print('FALTANDO (dependência de coleta ausente):', ', '.join(faltando))
              sys.exit(1)
          print('Todas as dependências de coleta presentes.')
          PY

      - name: Executar a suíte
        # Sem `|| true`, sem `continue-on-error`: qualquer teste vermelho
        # reprova o job. É o ponto inteiro deste workflow.
        run: python -m pytest -q --tb=short

      - name: Resumo
        if: always()
        run: |
          echo "### Suíte de testes" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "Todos os testes passaram." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Há teste falhando — ver o log do passo \`Executar a suíte\`." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Se a falha for \`ModuleNotFoundError\`, é dependência de ambiente, não regressão de código: confira \`requirements.txt\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  postgres-real:
    name: pytest (alocacao — Postgres real, efêmero)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Job SEPARADO do job `testes` acima — nunca altera o escopo
    # deliberado daquele job (comentário no topo do arquivo: "sem
    # serviço externo... a suíte é toda mockada"). Este job existe só
    # para validar magnata_os/documental/alocacao/ (migration +
    # adapter) contra um PostgreSQL REAL — mas o container de serviço é
    # provisionado e destruído pelo PRÓPRIO runner do GitHub Actions a
    # cada execução: nunca um banco permanente, nunca produção, nunca
    # credencial real (as credenciais abaixo só existem dentro deste
    # job efêmero, nunca reaproveitadas em nenhum outro lugar). Missão
    # "VALIDAÇÃO REAL POSTGRES DA VIGÊNCIA HISTÓRICA V1".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: magnata_teste
          POSTGRES_PASSWORD: magnata_teste_efemero
          POSTGRES_DB: magnata_alocacao_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # requirements.txt já declara psycopg[binary]==3.2.* -- driver
          # Postgres real, nenhuma dependência extra necessária aqui.
          pip install -r requirements.txt
          pip install pytest

      - name: Validar migration/adapter de alocacao contra Postgres real
        env:
          MAGNATA_TEST_POSTGRES_DSN: postgresql://magnata_teste:magnata_teste_efemero@localhost:5432/magnata_alocacao_teste
        run: python -m pytest -q --tb=short test_magnata_os_documental_alocacao_postgres_real.py

      - name: Resumo
        if: always()
        run: |
          echo "### Validação Postgres real — alocacao" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "Migration/adapter validados contra PostgreSQL real (container efêmero, descartado ao fim do job)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Falha na validação Postgres real — ver o log do passo \`Validar migration/adapter de alocacao contra Postgres real\`." >> "$GITHUB_STEP_SUMMARY"
          fi
